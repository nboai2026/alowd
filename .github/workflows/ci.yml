name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Package.swift needs Swift tools 6.0+. macos-14 defaults to Xcode 15.4
    # (Swift 5.10); macos-26 defaults to Xcode 26.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build
        run: |
          swift --version
          swift build

      - name: Test
        run: swift test
